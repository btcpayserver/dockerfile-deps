name: Build Only
run-name: ${{ inputs.tag || github.head_ref || github.ref_name }} (Build Only)

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag in Project/version format
        required: true
        type: string

env:
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_CLI_EXPERIMENTAL: enabled
  CI_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build_images:
    name: Build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'update/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: linuxamd64
            name: linux/amd64
          - image: linuxarm32v7
            name: linux/arm/v7
          - image: linuxarm64v8
            name: linux/arm64/v8
          - image: buildx
            name: buildx image
    steps:
      - name: Resolve PR image tag
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          if [[ ! "$HEAD_REF" =~ ^update/[^/]+/[^/]+$ ]]; then
            echo "Expected branch name update/<image>/<version>(-<revision>)" >&2
            exit 1
          fi
          echo "CI_TAG=${HEAD_REF#update/}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: matrix.image == 'buildx'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: matrix.image == 'buildx'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        shell: bash
        run: .github/scripts/run-image.sh "${{ matrix.image }}" build
